<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post</title>
</head>

<body style="text-align: center;">
  <section style="background-color: lightblue; padding: 1%; max-width: 300px; border-radius: 3px; margin: auto; ">
    <h2>Post Form</h2>
    <form action="/send_post" method="post">
      <input name="title" type="text" placeholder="title" style="display: block; margin: auto; margin-bottom: 10px; padding: 5px; width: 94%;">
      <input name="message" type="text" placeholder="message" style="display: block; margin: auto; margin-bottom: 10px; padding: 5px; width: 94%;">
      <input type="submit" style="display: block; width: 100%; padding: 7px;" value="Post">
    </form>
  </section>
</body>

</html>
