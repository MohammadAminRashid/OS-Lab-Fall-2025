<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Course</title>
</head>

<body style="text-align: center;">
  <section style="background-color: lightblue; padding: 1%; max-width: 300px; border-radius: 3px; margin: auto; ">
    <h2>Course Form</h2>
    <form action="/add_course" method="post">
      <input name="course_id" type="text" placeholder="course_id" style="display: block; margin: auto; margin-bottom: 20px; padding: 5px; width: 94%;">
      <input name="professor_id" type="text" placeholder="professor_id" style="display: block; margin: auto; margin-bottom: 20px; padding: 5px; width: 94%;">
      <input name="capacity" type="text" placeholder="capacity" style="display: block; margin: auto; margin-bottom: 20px; padding: 5px; width: 94%;">
      <input name="time" type="text" placeholder="time" style="display: block; margin: auto; margin-bottom: 20px; padding: 5px; width: 94%;">
      <input name="exam_date" type="text" placeholder="exam_date" style="display: block; margin: auto; margin-bottom: 20px; padding: 5px; width: 94%;">
      <input name="class_number" type="text" placeholder="class_number" style="display: block; margin: auto; margin-bottom: 20px; padding: 5px; width: 94%;">
      <input type="submit" style="display: block; width: 100%; padding: 7px;" value="Add Course">
    </form>
  </section>
</body>

</html>
